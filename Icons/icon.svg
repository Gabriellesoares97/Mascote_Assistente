<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8FF"/>
      <stop offset="100%" stop-color="#F1E9FF"/>
    </linearGradient>
    <linearGradient id="paw" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#C6AEF5"/>
      <stop offset="55%" stop-color="#9E7CEA"/>
      <stop offset="100%" stop-color="#7C55D6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7C55D6" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <g filter="url(#soft-shadow)">
    <g transform="translate(84,80) scale(3.45)" fill="url(#paw)" stroke="#ffffff" stroke-width="4.4" stroke-linejoin="round">
      <!-- almofada central -->
      <ellipse cx="50" cy="71" rx="28" ry="22"/>
      <!-- dedinhos, bem estufados e próximos, sem gaps grandes -->
      <ellipse cx="18" cy="36" rx="14.5" ry="18.5" transform="rotate(-16 18 36)"/>
      <ellipse cx="44.5" cy="17.5" rx="14.5" ry="18.5"/>
      <ellipse cx="71" cy="20" rx="14.5" ry="18.5" transform="rotate(14 71 20)"/>
      <ellipse cx="85.5" cy="45" rx="13.5" ry="17.5" transform="rotate(33 85.5 45)"/>
    </g>
    <!-- brilho principal na almofada -->
    <ellipse cx="212" cy="292" rx="34" ry="24" fill="#ffffff" opacity=".45"/>
    <!-- brilhinhos menores nos dedos -->
    <ellipse cx="150" cy="180" rx="10" ry="13" fill="#ffffff" opacity=".35" transform="rotate(-16 150 180)"/>
    <ellipse cx="235" cy="150" rx="9" ry="11" fill="#ffffff" opacity=".3"/>
  </g>

  <!-- sparkles decorativos, combinando com o acento "fofo" usado dentro do app -->
  <g fill="#C6AEF5" opacity=".9">
    <path d="M 396 96 l 7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7 z"/>
  </g>
  <g fill="#E7D9FF" opacity=".9">
    <circle cx="118" cy="110" r="7"/>
  </g>
</svg>
